name: Autoplayer Linux compilation smoke test

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'LocateSDL2.cmake'
      - '.github/workflows/autoplayer-linux-smoke.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev libjpeg-dev libbz2-dev zlib1g-dev libgtk-3-dev
      - name: Autoplayer harness tests
        run: python3 -m unittest discover -s tests -p 'test_autoplayer_harness.py' -v
      - name: Autoplayer policy regressions
        run: |
          cmake -S tests -B build/autoplayer-policy -DCMAKE_BUILD_TYPE=Release
          cmake --build build/autoplayer-policy --parallel 2
          ctest --test-dir build/autoplayer-policy --output-on-failure
      - name: Configure
        run: cmake -S . -B build/autoplayer-linux -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build/autoplayer-linux --parallel 2
